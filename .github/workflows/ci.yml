name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**/*.jsx'

jobs:
  test:
    name: E2E Tests
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - name: Build and start container
        run: |
          docker build -t snippets-frontend ./frontend
          docker run -d --name frontend -p 8080:8080 snippets-frontend
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Cypress
        uses: cypress-io/github-action@v6
        with:
          working-directory: frontend
          command: npm run cy:run
          wait-on: http://localhost:8080
      - name: Stop container
        if: always()
        run: |
          docker stop frontend || true
          docker rm frontend || true
