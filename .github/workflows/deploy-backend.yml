name: Deploy Backend

on:
  workflow_call:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    name: Build and Push Backend Image
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::040982755314:role/github-actions-ecr-push
          role-session-name: github-actions
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/snippets-backend:$IMAGE_TAG -t $ECR_REGISTRY/snippets-backend:latest ./backend
          docker push $ECR_REGISTRY/snippets-backend:$IMAGE_TAG
          docker push $ECR_REGISTRY/snippets-backend:latest
