name: Build Backend

on:
  workflow_call:
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  build-and-push:
    name: Build and Push Backend Image
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4

      - name: Bump patch version
        id: version
        working-directory: backend
        run: |
          npm version patch --no-git-tag-version
          echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/package.json
          git commit -m "chore(backend): bump version to ${{ steps.version.outputs.VERSION }}"
          git pull --rebase --autostash origin main
          git push origin main

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::040982755314:role/github-actions-ecr-push
          role-session-name: github-actions
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          docker build \
            -t $ECR_REGISTRY/snippets/backend:$IMAGE_TAG \
            -t $ECR_REGISTRY/snippets/backend:$VERSION \
            -t $ECR_REGISTRY/snippets/backend:latest \
            ./backend
          docker push $ECR_REGISTRY/snippets/backend:$IMAGE_TAG
          docker push $ECR_REGISTRY/snippets/backend:$VERSION
          docker push $ECR_REGISTRY/snippets/backend:latest

      - name: Create git tag
        run: |
          git tag "backend/v${{ steps.version.outputs.VERSION }}"
          git push origin "backend/v${{ steps.version.outputs.VERSION }}"
